<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'">
  <title>MD Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img src="assets/logo.svg" alt="" class="logo" width="36" height="36">
        <div>
          <h1 class="wordmark">MD <span class="wordmark-accent">Converter</span></h1>
          <p class="subtitle">Converta documentos para Markdown</p>
        </div>
      </div>
      <!-- Empty on purpose: renderer.js owns this label, it toggles while running -->
      <button id="convert" class="btn btn-primary" disabled></button>
    </header>

    <section class="controls">
      <button id="pick" class="btn btn-outline btn-sm">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v4a1 1 0 0 0 1 1h4" /><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z" /><path d="M12 11v6" /><path d="M9 14h6" /></svg>
        Adicionar arquivos…
      </button>
      <div class="outdir">
        <!-- Empty on purpose: renderer.js owns this label, it tracks the chosen folder -->
        <span id="outdir-label" class="outdir-label truncate"></span>
        <button id="choose-outdir" class="btn btn-outline btn-sm">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2" /></svg>
          Escolher pasta…
        </button>
        <button id="reset-outdir" class="btn btn-icon btn-ghost" hidden title="Voltar para a pasta de cada arquivo"></button>
      </div>
      <span class="spacer"></span>
      <button id="open-outdir" class="btn btn-outline btn-sm" disabled>Abrir pasta de saída</button>
      <button id="clear" class="btn btn-outline btn-sm" disabled>Limpar lista</button>
    </section>

    <p id="banner" class="banner" hidden>
      <svg class="banner-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /><path d="M12 8v4" /><path d="M12 16h.01" /></svg>
      <span id="banner-msg"></span>
    </p>

    <section id="drop" class="drop">
      <svg class="drop-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" /><path d="M7 9l5 -5l5 5" /><path d="M12 4l0 12" /></svg>
      <div class="drop-text">
        <p class="drop-title">Arraste e solte documentos aqui</p>
        <!-- Mirrors SUPPORTED_EXTENSIONS in src/queue.js — update both together -->
        <p class="drop-sub">PDF · Word · PowerPoint · Excel · CSV · JSON · XML · HTML · TXT · ZIP</p>
      </div>
    </section>

    <ul id="list" class="list"></ul>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
