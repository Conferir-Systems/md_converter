<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>MarkItDown GUI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>MarkItDown GUI</h1>
        <p class="muted" id="subtitle">Converta documentos para Markdown</p>
      </div>
      <button id="convert" class="primary" disabled>Converter tudo</button>
    </header>

    <section class="controls">
      <button id="pick">Adicionar arquivos…</button>
      <div class="outdir">
        <span id="outdir-label" class="muted">Saída: mesma pasta de cada arquivo</span>
        <button id="choose-outdir">Escolher pasta…</button>
        <button id="reset-outdir" hidden title="Voltar para a pasta de cada arquivo">×</button>
      </div>
      <span class="spacer"></span>
      <button id="open-outdir" disabled>Abrir pasta de saída</button>
      <button id="clear" disabled>Limpar lista</button>
    </section>

    <p id="banner" class="banner" hidden></p>

    <section id="drop" class="drop">
      <p id="drop-title">Arraste e solte documentos aqui</p>
      <p class="muted small">PDF · Word · PowerPoint · Excel · CSV · JSON · XML · HTML · TXT · ZIP</p>
    </section>

    <ul id="list" class="list"></ul>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
